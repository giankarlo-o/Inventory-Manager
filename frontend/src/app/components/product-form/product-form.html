<section class="product-form">
  <h2>{{ formProduct._id ? 'Edit Product' : 'Add Product' }}</h2>

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="saveProduct()">
    <label for="title">Title</label>
    <input
      id="title"
      name="title"
      type="text"
      [(ngModel)]="formProduct.title"
      required
    />

    <label for="description">Description</label>
    <textarea
      id="description"
      name="description"
      [(ngModel)]="formProduct.description"
      required
    ></textarea>

    <label for="price">Price</label>
    <input
      id="price"
      name="price"
      type="number"
      min="0"
      step="0.01"
      [(ngModel)]="formProduct.price"
      required
    />

    <label for="quantityInStock">Quantity in Stock</label>
    <input
      id="quantityInStock"
      name="quantityInStock"
      type="number"
      min="0"
      step="1"
      [(ngModel)]="formProduct.quantityInStock"
      required
    />

    <div class="form-actions">
      <button type="submit">
        {{ formProduct._id ? 'Update Product' : 'Create Product' }}
      </button>

      @if (formProduct._id) {
        <button type="button" (click)="cancel()">Cancel</button>
      }
    </div>
  </form>
</section>
