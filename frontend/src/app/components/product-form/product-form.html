<section
  class="product-form"
  [class.is-collapsed]="!isExpanded"
  [class.is-expanded]="isExpanded"
>
  <button
    type="button"
    class="product-form-toggle"
    (click)="openForm()"
    [attr.aria-expanded]="isExpanded"
  >
    <span>{{ formProduct._id ? 'Edit Product' : 'Add Product' }}</span>
    <small>
      {{
        isExpanded
          ? 'Enter product details below'
          : 'Click to add a product'
      }}
    </small>
  </button>

  @if (isExpanded) {
    <div class="product-form-content">
      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <form (ngSubmit)="saveProduct()">
        <div class="title-field">
          <label for="title">Title</label>
          <input
            id="title"
            name="title"
            type="text"
            [(ngModel)]="formProduct.title"
            required
          />
        </div>

        <div class="form-fields-grid">
          <div class="description-field">
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              rows="2"
              [(ngModel)]="formProduct.description"
              required
            ></textarea>
          </div>

          <div class="details-column">
            <div class="price-field">
              <label for="price">Price</label>
              <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="0.01"
                [(ngModel)]="formProduct.price"
                required
              />
            </div>

            <div class="quantity-field">
              <label for="quantityInStock">Quantity in Stock</label>
              <input
                id="quantityInStock"
                name="quantityInStock"
                type="number"
                min="0"
                step="1"
                [(ngModel)]="formProduct.quantityInStock"
                required
              />
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit">
            {{ formProduct._id ? 'Update Product' : 'Create Product' }}
          </button>

          @if (formProduct._id) {
            <button type="button" class="cancel-button" (click)="cancel()">Cancel</button>
          }
        </div>
      </form>
    </div>
  }
</section>
